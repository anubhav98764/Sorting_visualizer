<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/x-icon" href="path/to/your/favicon.ico">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Login / Register</title>
</head>

<body>
    <div class="container">
        
        <!-- Login Form Box -->
        <div class="form-box login">
            <form action="">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="email" placeholder="Email" required name="email">
                    <i class='bx bx-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required name="password">
                    <i class='bx bx-lock'></i>
                </div>
                <div class="forget-link">
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="or-text">OR</p>
                <div class="social-icons">
                  <a href="http://localhost:5000/api/auth/google">
                    <i class='bx bxl-google'></i>Continue With Google
                  </a>
                </div>
                <p class="switch-text">New user? <span id="to-register">Register now</span></p>
            </form>
        </div>

        <!-- Register Form Box (Initially Hidden) -->
        <div class="form-box register" style="display: none;">
            <form action="">
                <h1>Sign up</h1>
                <div class="input-box">
                    <input type="email" placeholder="Email" required name="email">
                    <i class='bx bx-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="Name" required name="name">
                    <i class='bx bx-user'></i>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="Date of birth" required name="dob" onfocus="this.type='date'"
                        onblur="if(!this.value)this.type='text'" class="date-input">
                    <i class='bx bx-calendar'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required name="password">
                    <i class='bx bx-lock'></i>
                </div>
                <button type="submit" class="btn">Register</button>
                <p class="or-text">OR</p>
                <div class="social-icons">
                   <a href="http://localhost:5000/api/auth/google">
                    <i class='bx bxl-google'></i>Continue With Google
                   </a>
                </div>
                <p class="switch-text">Already have an account? <span id="to-login">Login here</span></p>
            </form>
        </div>

    </div>

    <script src="login.js" defer></script>
</body>

</html>
