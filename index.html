<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/x-icon" href="path/to/your/favicon.ico">


    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Login</title>

</head>

<body>
    <div class="container">
        <div class="form-box login">
            <form action="">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="email" placeholder="Email" required name="email">
                    <i class='bx  bx-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required name="password">
                    <i class='bx  bx-lock'></i>
                </div>
                <div class="forget-link">
                    <a href="#"> Forgot password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p>or login with social platform</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-facebook'></i></a>
                    <a href="#"><i class='bx bxl-twitter'></i></a>
                    <a href="#"><i class='bx bxl-google'></i></a>
                    <a href="#"><i class='bx bxl-linkedin'></i></a>
                    <a href="#"><i class='bx bxl-github'></i></a>
                </div>
            </form>
        </div>
        <div class="form-box register">
            <form action="">
                <h1>Sign up</h1>
                <div class="input-box">
                    <input type="email" placeholder="Email" required name="email">
                    <i class='bx  bx-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="Name" required name="name">
                    <i class='bx  bx-user'></i>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="Date of birth" required name="dob" onfocus="this.type='date'"
                        onblur="if(!this.value)this.type='text'" class="date-input">
                    <i class='bx bx-calendar'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required name="password">
                    <i class='bx  bx-lock'></i>
                </div>
                <div class="forget-link">
                    <a href="#"> Forgot password?</a>
                </div>
                <button type="submit" class="btn">Register</button>
                <p>or Register with social platform</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-facebook'></i></a>
                    <a href="#"><i class='bx bxl-twitter'></i></a>
                    <a href="#"><i class='bx bxl-google'></i></a>
                    <a href="#"><i class='bx bxl-linkedin'></i></a>
                    <a href="#"><i class='bx bxl-github'></i></a>
                </div>
            </form>
        </div>
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Welcome To Visualizer</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>

            </div>
            <div class="toggle-panel toggle-Right">
                <h1> Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>

            </div>
        </div>
    </div>
    <script src="login.js" defer></script>
</body>

</html>
